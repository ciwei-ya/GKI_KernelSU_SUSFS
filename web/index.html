<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKI Kernel Versions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <h1>GKI Kernel Versions</h1>
      <p>Android Generic Kernel Image &mdash; version tracking dashboard</p>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <span id="themeIcon">&#9789;</span>
          <span id="themeLabel">Light</span>
        </button>
        <a class="github-link" href="https://github.com/AzusaOS/GKI_KernelSU_SUSFS" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="tabs-container">
    <div class="tabs" id="tabs"></div>
  </nav>

  <!-- Main -->
  <main class="main" id="content">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p style="margin-top: 1rem;">Loading kernel data&hellip;</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    Data sourced from
    <a href="https://android.googlesource.com/kernel/common" target="_blank" rel="noopener">android.googlesource.com</a>.
    Updated automatically via GitHub Actions.
  </footer>

<script>
(function () {
  'use strict';

  const DATA_FILES = [
    { android: 'android12', kernel: '5.10', label: 'Android 12 / 5.10' },
    { android: 'android13', kernel: '5.15', label: 'Android 13 / 5.15' },
    { android: 'android14', kernel: '6.1',  label: 'Android 14 / 6.1' },
    { android: 'android15', kernel: '6.6',  label: 'Android 15 / 6.6' },
  ];

  // ---- Theme ----
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  const themeLabel = document.getElementById('themeLabel');

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    if (theme === 'dark') {
      themeIcon.textContent = '\u263D';
      themeLabel.textContent = 'Light';
    } else {
      themeIcon.textContent = '\u2600';
      themeLabel.textContent = 'Dark';
    }
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  setTheme(savedTheme);

  themeToggle.addEventListener('click', function () {
    const current = document.documentElement.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
  });

  // ---- Data loading ----
  async function loadData() {
    const results = await Promise.allSettled(
      DATA_FILES.map(f =>
        fetch(`data/${f.android}/${f.kernel}.json`).then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
      )
    );

    const datasets = [];
    for (let i = 0; i < results.length; i++) {
      if (results[i].status === 'fulfilled') {
        datasets.push({ meta: DATA_FILES[i], data: results[i].value });
      }
    }

    if (datasets.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="error"><p>Failed to load kernel data.</p><p style="margin-top:0.5rem;color:var(--text-muted)">Make sure <code>web/data/</code> contains the JSON files.</p></div>';
      return;
    }

    renderTabs(datasets);
    renderPanels(datasets);

    // Activate first tab
    const firstTab = document.querySelector('.tab');
    if (firstTab) firstTab.click();
  }

  // ---- Render tabs ----
  function renderTabs(datasets) {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    datasets.forEach((ds, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = ds.meta.label;
      btn.dataset.panel = `panel-${idx}`;
      btn.addEventListener('click', () => activateTab(btn));
      tabsEl.appendChild(btn);
    });
  }

  function activateTab(btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const panel = document.getElementById(btn.dataset.panel);
    if (panel) panel.classList.add('active');
  }

  // ---- Render panels ----
  function renderPanels(datasets) {
    const content = document.getElementById('content');
    content.innerHTML = '';

    datasets.forEach((ds, idx) => {
      const panel = document.createElement('div');
      panel.className = 'tab-panel';
      panel.id = `panel-${idx}`;
      panel.innerHTML = buildCard(ds.data, ds.meta);
      content.appendChild(panel);
    });
  }

  function buildCard(data, meta) {
    const entries = data.entries || [];
    const lts = data.lts;
    const totalReleases = entries.length;
    const firstDate = entries.length > 0 ? entries[0].date : 'N/A';
    const lastDate = entries.length > 0 ? entries[entries.length - 1].date : 'N/A';
    const lastKernel = entries.length > 0 ? entries[entries.length - 1].kernel : 'N/A';

    let ltsHtml = '';
    if (lts) {
      ltsHtml = `
        <div class="lts-box">
          <span class="lts-label">LTS</span>
          <span class="lts-version">${esc(lts)}</span>
        </div>`;
    }

    let tableRows = '';
    // Show newest first
    const reversed = [...entries].reverse();
    reversed.forEach(e => {
      tableRows += `
        <tr>
          <td class="date-cell">${esc(e.date)}</td>
          <td class="kernel-version">${esc(e.kernel)}</td>
        </tr>`;
    });

    return `
      <div class="card">
        <div class="card-header">
          <span class="badge badge-android">${esc(meta.android.replace('android', 'Android '))}</span>
          <span class="badge badge-kernel">Kernel ${esc(meta.kernel)}</span>
        </div>
        ${ltsHtml}
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Releases</div>
            <div class="stat-value">${totalReleases}</div>
          </div>
          <div class="stat">
            <div class="stat-label">First</div>
            <div class="stat-value">${esc(firstDate)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Latest</div>
            <div class="stat-value">${esc(lastDate)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Latest Kernel</div>
            <div class="stat-value">${esc(lastKernel)}</div>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Kernel Version</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function esc(str) {
    const el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  // ---- Init ----
  loadData();
})();
</script>

</body>
</html>
